name: Release Linux AppImage

# Tag-triggered AppImage release. Build steps live in
# packaging/make-appimage.sh. Uses pkgforge's anylinux tooling
# (Arch container + quick-sharun) for a broadly-compatible AppImage.
#
# See the reference project LBALab/lba2-classic-community for the pattern.

on:
  push:
    tags:
      - 'v*' # Triggers only on version tags
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Tag (or branch) to attach the release to. Leave empty to create the
          release against the current ref; use the v* name when releasing a
          new version without pushing it as a tag first.
        required: false
        default: ''

jobs:
  build:
    name: "Build ${{ matrix.arch }}"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    container: ghcr.io/pkgforge-dev/archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@v2
      # The script pulls from Arch mirrors and downloads appimagetool from a
      # GitHub release; both have failed a leg outright when upstream returned
      # 5xx. Retry the whole script rather than any one fetch: pacman and the
      # CMake build are both incremental, so a second attempt costs seconds.
      - name: Make AppImage
        run: |
          for attempt in 1 2 3; do
            # Start each attempt from a clean AppDir: a run that died inside
            # quick-sharun leaves a half-populated tree behind, and the next
            # attempt would then fail on that rather than on the real cause.
            rm -rf ./AppDir ./dist
            if /bin/sh ./packaging/make-appimage.sh; then
              exit 0
            fi
            echo "AppImage build attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "AppImage build failed after 3 attempts" >&2
          exit 1
      - name: Upload temporary artifact
        uses: actions/upload-artifact@v7
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    name: Attach to GitHub Release
    needs: [build]
    # Release on tag pushes and always on manual dispatch. A dispatch with no
    # tag_name falls back to v<version from VERSION.txt> (copied into dist/ by
    # make-appimage.sh, so it arrives with the downloaded artifacts).
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag_name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(cat VERSION.txt)
            echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release AppImage
        # softprops/action-gh-release@v2 is idempotent: creates the Release
        # if absent, attaches/updates if present. Creates the tag too when it
        # does not exist yet.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.zsync
          tag_name: ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
